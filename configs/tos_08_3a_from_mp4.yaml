# Tears of Steel shot 08_3a, source frames 100-199 (CC-BY 3.0, Blender Foundation | mango.blender.org)
# Green screen close-up, grey hair and beard: hardest matting case.
# Green screen keying gives a near-ground-truth alpha to score MatAnyone (Phase 3).
# Starts from the mp4 in samples/videos (in git), so a fresh clone can run it.
shot: tos_08_3a_from_mp4
input_video: samples/videos/tos_08_3a.mp4
stages: [extract, segment, matte, depth, align, fuse, exr]
segmentation:
  prompts:
    - frame: 1
      points: [[680, 380], [600, 220], [560, 780], [260, 700], [270, 880]]  # face, hair, jacket, left sleeve x2
      labels: [1, 1, 1, 1, 1]
      box: null
