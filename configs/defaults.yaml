# Default settings for every shot. A shot config (configs/<shot>.yaml)
# only needs to override what is different. Merge is recursive.

shot: null                 # required in the shot config
data_root: data            # outputs go to data/<shot>/...
input_video: null          # path to the source video (not needed if frames/ already exists)
seed: 0

# Stages run in this order. Remove one to skip it (its output must already exist).
stages: [extract, segment, matte, depth, align, fuse, exr]

frames:
  start_time: null         # seconds into the video, e.g. 12.5
  max_frames: 100          # develop on ~100 frames first (CLAUDE.md rule)
  resize_height: null      # e.g. 1080 to downscale a 4K source
  overwrite: false

segmentation:              # [A] SAM 2 -> mask/
  checkpoint: facebook/sam2.1-hiera-small
  # One entry per prompted frame. Add a second entry on a later frame if the object is lost.
  # points are [x, y] in pixels of the ORIGINAL frame; labels: 1 = object, 0 = background.
  prompts: []

matting:                   # [A] MatAnyone -> alpha/
  mask_frame: 1            # which mask/ frame MatAnyone starts from
  warmup: 10               # MatAnyone first-frame refinement iterations
  erode: 10                # px: mask shrink -> sure foreground
  dilate: 10               # px: mask grow -> everything between is "unknown" edge
  max_size: 720            # short side for MatAnyone; -1 = full res. On 8 GB, full 1080p spills
                           # out of VRAM (8.6 s/frame) vs 0.17 s/frame at 720, alpha diff MAD 0.0015

depth:                     # [B] -> depth_raw/
  model: vda               # vda = Video Depth Anything (main), dav2 = Depth Anything V2-Small (baseline)
  encoder: vits            # vits = Small (Apache 2.0). Do not use vitb/vitl for commercial work.
  input_size: 518          # model input short side; depth is upsampled back to frame size
  fp16: true
  out_subdir: depth_raw    # baseline runs can write to depth_raw_dav2 for comparison

align:                     # [B] depth_raw/ -> depth/
  # global    : one scale/shift for the whole shot (enough for Video Depth Anything)
  # per_frame : first fit every frame to the shot median, then global (for flickering per-frame models)
  # window    : like per_frame but the reference is the median of +-window/2 frames (camera moves)
  mode: global
  window: 30

fusion:                    # [C] -> depth_final/, stats.json
  alpha_threshold: 0.5     # stats only where alpha > this (design decision 2)
  percentiles: [2, 98]
  refine:
    enabled: true
    band_px: 12            # refine only within this distance of the matte edge
    diameter: 9            # filter window (pixels)
    sigma_color: 20.0      # in 0-255 RGB units: smaller = stops more strongly at colour edges
    sigma_space: 5.0       # pixels
    alpha_weight: 2.0      # how strongly the matte edge also blocks smoothing
    iterations: 2

exr:                       # [D] -> exr/
  # Z convention written to the file (design decision 4: converted ONCE, here).
  #   depth     : larger = farther (Blender / most compositing), Z = 1 / disparity
  #   disparity : larger = closer (native Depth Anything)
  z_mode: depth
  z_near: 1.0              # z_mode=depth: closest part of the shot ~ this distance
  z_far: 10.0              #               farthest part ~ this distance (relative units, not metres)
  compression: zip         # zip | piz | none
  linearize_rgb: true      # convert sRGB PNG -> linear for EXR (VFX convention)
  use_source_exr: true     # if data/<shot>/source_exr/ exists (Tears of Steel), copy its linear RGB
  premultiply: false       # false: RGB = full plate, A = matte (use Premult in Nuke)
